# Copy to .github/workflows/ in your app repo: weekly flag-debt report in the job summary.
name: flag-debt
on:
  schedule: [{ cron: "0 8 * * 1" }]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install git+https://github.com/karanjakhar/flag-reaper
      - name: Scan
        env:
          FLAGSMITH_API_TOKEN: ${{ secrets.FLAGSMITH_API_TOKEN }}
          FLAGSMITH_PROJECT_ID: ${{ vars.FLAGSMITH_PROJECT_ID }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          NO_COLOR=1 flagreaper scan | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
